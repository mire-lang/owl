name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
            avenys_artifact: mire-compiler-x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: linux-aarch64
            avenys_artifact: mire-compiler-aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Download precompiled mire compiler from avenys release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AVENYS_TAG="v4.4.44"
          echo "Using avenys release: $AVENYS_TAG"
          
          # Download the mire compiler artifact for this target
          gh release download "$AVENYS_TAG" \
            --repo mire-lang/Avenys-rust \
            --pattern "${{ matrix.avenys_artifact }}.tar.gz" \
            --dir /tmp/compiler-artifacts

      - name: Install mire system-wide
        run: |
          tar xzf /tmp/compiler-artifacts/${{ matrix.avenys_artifact }}.tar.gz -C /tmp
          sudo install -m 0755 /tmp/compiler/mire /usr/local/bin/mire
          sudo mkdir -p /usr/local/lib/mire
          sudo cp -r /tmp/compiler/runtime /usr/local/lib/mire/runtime
          sudo cp -r /tmp/compiler/pal /usr/local/lib/mire/pal
          mire --version

      - name: Install build prerequisites + libsodium (for bundling)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            wget ca-certificates pkg-config build-essential gcc g++ make \
            libsodium23 libsodium-dev libzstd-dev libarchive-dev zlib1g-dev \
            tcc libtcc-dev
          # The compiler shells out to unversioned opt/llc/clang/ld.lld.
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
          sudo apt-get install -y -qq \
            llvm-22 llvm-22-dev llvm-22-tools clang-22 lld-22 libpolly-22-dev
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"
          sudo ln -sf /usr/lib/llvm-22/bin/llc /usr/bin/llc

      - name: Fetch Kioto API used by the Owl test suite
        uses: actions/checkout@v4
        with:
          repository: mire-lang/Kioto
          path: kioto-src
          ref: 867dc915dde104a094a3ac72826e6a0d8f06effb

      - name: Fetch Mire stdlib API used by the Owl test suite
        uses: actions/checkout@v4
        with:
          repository: mire-lang/mire-lib
          path: mire-src
          ref: 1378eaa6c6c565c12e9ba5a2f975631e5599d046

      - name: Setup owl dependency paths
        run: |
          mkdir -p ~/.owl/libs
          cp -a kioto-src ~/.owl/libs/kioto
          cp -a mire-src ~/.owl/libs/mire
          # Remove the version aliases that point back to their own package
          # roots. Preserve ordinary symlinks, including Kioto sandbox tests.
          for alias in \
            "$HOME/.owl/libs/kioto/kioto@3.1.0" \
            "$HOME/.owl/libs/mire/mire@2.1.0-beta"; do
            if [ -L "$alias" ]; then rm "$alias"; fi
          done

      - name: Generate avenys config for the owl build
        run: |
          owl_version="${GITHUB_REF_NAME#v}"
          cat > native/mire-config.toml <<EOF
          [project]
          name = "owl"
          version = "${owl_version}"
          entry = "code/main.mire"

          [build]
          profile = "release"
          opt-level = 3
          artifact = "bin"
          runtime = "minimal"
          target = "${{ matrix.target }}"

          [paths]
          bin = "${{ github.workspace }}/bin"
          cache = "/tmp/owl-archive-cache"

          [cfg]
          libs = []
          sources = []
          link-dirs = []
          cflags = []
          EOF

      - name: Build owl
        run: |
          mire build code/main.mire --release -O3 --no-analysis-cache --config native/mire-config.toml --lib-dir "$HOME/.owl/libs"

      - name: Verify owl
        run: |
          chmod +x bin/main
          expected="$(sed -n 's/^version = "\([^"]*\)"/\1/p' owl.toml | head -1)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            expected="${GITHUB_REF_NAME#v}"
          fi
          actual="$(./bin/main --version 2>/dev/null || ./bin/main -V)"
          printf 'Expected tag version: %s\\nOwl reports: %s\\n' "$expected" "$actual"
          case "$actual" in
            *"$expected"*) ;;
            *) echo "Owl version does not match release tag" >&2; exit 1 ;;
          esac

      - name: Configure release validation environment
        run: |
          chmod +x bin/main
          echo "MIRE_COMPILER=/usr/local/bin/mire" >> "$GITHUB_ENV"
          echo "OWL_COMPILER_LIBS=$HOME/.owl/libs" >> "$GITHUB_ENV"
          echo "OWL_BIN=$PWD/bin/main" >> "$GITHUB_ENV"
          echo "OWL_TEST_TARGET=${{ matrix.target }}" >> "$GITHUB_ENV"

      - name: Resolve release project dependencies
        run: ./bin/main install --yes

      - name: Validate release project dependencies
        run: ./bin/main check --deps

      - name: Run Owl test suite on release target
        run: ./bin/main test -v

      - name: Package owl tarball
        run: |
          mkdir -p dist/owl/lib
          cp bin/main dist/owl/owl
          cp -r ~/.owl/libs/kioto dist/owl/kioto
          find /usr/lib -name 'libsodium.so.23*' -exec cp -a {} dist/owl/lib/ \;
          cd dist
          tar czf ../owl-${{ matrix.artifact }}.tar.gz owl/
          cd ..
          sha256sum owl-${{ matrix.artifact }}.tar.gz > owl-${{ matrix.artifact }}.sha256

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            owl-${{ matrix.artifact }}.tar.gz
            owl-${{ matrix.artifact }}.sha256
