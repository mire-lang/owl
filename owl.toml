[project]
name = "owl"
version = "1.6.12"
description = "Package and project manager for the Mire (Avenys) language"
entry = "src/main.mire"
languages = ["mire"]

[build]
compiler = "mire"
profile = "debug"
opt-level = "0"
artifact = "bin"
runtime = "minimal"
target = "x86_64-unknown-linux-gnu"
panic = "abort"
incremental = true
debug-info = true

[paths]
sources = "src"
tests = "tests"
output = "bin"
cache = "bin/.cache"
generated = "bin/generated"

[cfg]
publisher = "publish.toml"
registry = "local"
registry_url = "http://localhost:8080"
cache = "~/.owl/cache"
libs = "~/.owl/libs"

[exports]
owl = "src/main.mire"
util = "src/util"
crypto = "src/crypto"
trust = "src/trust"
registry = "src/registry"
install = "src/install"
build = "src/build"
check = "src/check"
info = "src/info"
ui = "src/ui"
args = "src/args"
deps = "src/deps"
dep_resolver = "src/dep_resolver"
lockfile = "src/lockfile"
gc = "src/gc"
profile = "src/profile"
export = "src/export"
upgrade = "src/upgrade"
sandbox = "src/sandbox"
os = "src/os"
_externs = "src/_externs"

[dependencies]
kioto = { path = "~/.owl/libs/kioto" }
mire = { path = "~/.owl/libs/mire" }
crypto = { path = "./src/crypto" }

["owl@lock"]
version = "3"
